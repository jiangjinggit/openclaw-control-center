<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置向导 - OpenClaw 控制中心</title>
  <link rel="stylesheet" href="/theme-vars.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .wizard {
      max-width: 600px;
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
    }
    .wizard-icon {
      font-size: 64px;
      margin-bottom: 24px;
    }
    .wizard-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .wizard-text {
      font-size: 16px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .wizard-steps {
      text-align: left;
      margin-bottom: 32px;
      padding: 24px;
      background: var(--bg-tertiary);
      border-radius: 12px;
    }
    .step {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .step:last-child {
      margin-bottom: 0;
    }
    .step-number {
      width: 32px;
      height: 32px;
      background: var(--accent-primary);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }
    .step-content {
      flex: 1;
    }
    .step-title {
      font-weight: 600;
      margin-bottom: 4px;
    }
    .step-desc {
      font-size: 14px;
      color: var(--text-tertiary);
    }
    .btn {
      padding: 14px 32px;
      background: var(--accent-primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      margin-left: 12px;
    }
    .btn-secondary:hover {
      background: var(--bg-hover);
    }
  </style>
  <script src="/theme.js"></script>
</head>
<body>
  <div class="wizard">
    <div class="wizard-icon">🚀</div>
    <h1 class="wizard-title">欢迎使用 OpenClaw 控制中心</h1>
    <p class="wizard-text">
      这是一个外挂式的 OpenClaw 管理和监控工具，帮助你更好地管理你的 OpenClaw 实例。
    </p>
    
    <div class="wizard-steps">
      <div class="step">
        <div class="step-number">1</div>
        <div class="step-content">
          <div class="step-title">确保 OpenClaw 已安装</div>
          <div class="step-desc">控制中心需要读取 OpenClaw 的配置和数据</div>
        </div>
      </div>
      <div class="step">
        <div class="step-number">2</div>
        <div class="step-content">
          <div class="step-title">检查连接状态</div>
          <div class="step-desc">控制中心会自动检测 OpenClaw Gateway 状态</div>
        </div>
      </div>
      <div class="step">
        <div class="step-number">3</div>
        <div class="step-content">
          <div class="step-title">开始使用</div>
          <div class="step-desc">查看会话、任务、成本等信息</div>
        </div>
      </div>
    </div>
    
    <div>
      <a href="/" class="btn">进入控制中心</a>
      <a href="javascript:history.back()" class="btn btn-secondary">返回</a>
    </div>
  </div>
</body>
</html>
