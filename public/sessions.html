<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会话中心 - OpenClaw 控制中心</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;margin:0;color:#111827}
    .wrap{max-width:1240px;margin:0 auto;padding:24px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
    .btn{border:1px solid #dbe1ea;background:#fff;border-radius:10px;padding:9px 14px;text-decoration:none;color:#334155;cursor:pointer}
    .panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px}
    .toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    .input,.select{padding:10px 12px;border:1px solid #dbe1ea;border-radius:10px;background:#fff;min-width:180px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0 0 18px}
    .stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:14px}
    .stat .label{font-size:12px;color:#64748b;margin-bottom:8px;display:block}
    .stat .value{font-size:24px;font-weight:700}
    .row{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid #f1f5f9}
    .row:last-child{border-bottom:none}
    .title{font-weight:700}
    .meta{font-size:12px;color:#64748b;margin-top:6px;word-break:break-all}
    .pill{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
    .ok{background:#dcfce7;color:#166534}
    .info{background:#dbeafe;color:#1d4ed8}
    .warn{background:#fef3c7;color:#92400e}
    .tokens{font-weight:700;font-size:24px}
    .empty{color:#94a3b8;padding:20px 0}
    .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
    .muted{color:#64748b}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>会话中心</h1>
        <div class="meta">查看最近 24 小时会话，支持按 Agent / 类型 / 模型过滤，并进入详情页看同族运行聚合。</div>
      </div>
      <div>
        <button class="btn" id="syncBtn">立即同步</button>
        <a class="btn" href="/">返回首页</a>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="panel">
      <div class="toolbar">
        <input class="input" id="keyword" placeholder="搜索会话名 / 模型 / 关键词">
        <select class="select" id="agentFilter"><option value="">全部 Agent</option></select>
        <select class="select" id="kindFilter"><option value="">全部类型</option></select>
        <select class="select" id="modelFilter"><option value="">全部模型</option></select>
      </div>
      <div id="list">加载中...</div>
    </div>
  </div>

  <script>
    let all = [];

    function fmtTime(value){
      if(!value) return '未知';
      const ts = Number(value);
      return new Date(ts > 1e12 ? ts : value).toLocaleString('zh-CN',{hour12:false});
    }

    function fmtNum(value){
      return Number(value || 0).toLocaleString('zh-CN');
    }

    function parseSessionKey(sessionKey=''){
      const parts = String(sessionKey || '').split(':').filter(Boolean);
      const result = {
        agentId: parts[1] || 'unknown',
        kind: parts[2] || 'unknown',
        channel: 'unknown',
        target: null,
        cronId: null,
        runId: null
      };
      if(parts[2] === 'cron'){
        result.kind = parts.includes('run') ? 'cron-run' : 'cron';
        result.cronId = parts[3] || null;
        if(parts.includes('run')) result.runId = parts[parts.indexOf('run') + 1] || null;
        return result;
      }
      if(parts[2] === 'main'){
        result.kind = 'main';
        return result;
      }
      if(parts.length >= 5){
        result.kind = 'channel';
        result.channel = parts[2] || 'unknown';
        result.target = parts.slice(4).join(':') || null;
      }
      return result;
    }

    function enrich(items){
      return items.map(item => ({ ...item, parsed: parseSessionKey(item.key) }));
    }

    function renderStats(items){
      const total = items.length;
      const agents = new Set(items.map(i => i.parsed.agentId).filter(Boolean)).size;
      const cronRuns = items.filter(i => i.parsed.kind === 'cron-run').length;
      const totalTokens = items.reduce((sum, item) => sum + Number(item.totalTokens || 0), 0);
      document.getElementById('stats').innerHTML = [
        ['会话数', fmtNum(total)],
        ['Agent 数', fmtNum(agents)],
        ['Cron Run 数', fmtNum(cronRuns)],
        ['总 Tokens', fmtNum(totalTokens)]
      ].map(([label, value]) => `<div class="stat"><span class="label">${label}</span><div class="value">${value}</div></div>`).join('');
    }

    function fillFilters(items){
      const agents = [...new Set(items.map(i => i.parsed.agentId).filter(Boolean))].sort();
      const kinds = [...new Set(items.map(i => i.parsed.kind).filter(Boolean))].sort();
      const models = [...new Set(items.map(i => i.model).filter(Boolean))].sort();
      document.getElementById('agentFilter').innerHTML = '<option value="">全部 Agent</option>' + agents.map(v => `<option value="${v}">${v}</option>`).join('');
      document.getElementById('kindFilter').innerHTML = '<option value="">全部类型</option>' + kinds.map(v => `<option value="${v}">${v}</option>`).join('');
      document.getElementById('modelFilter').innerHTML = '<option value="">全部模型</option>' + models.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function render(){
      const kw = (document.getElementById('keyword').value || '').toLowerCase();
      const agentFilter = document.getElementById('agentFilter').value;
      const kindFilter = document.getElementById('kindFilter').value;
      const modelFilter = document.getElementById('modelFilter').value;
      const items = all.filter(i => {
        const source = [i.displayName, i.key, i.model, i.parsed.agentId, i.parsed.kind, i.parsed.channel, i.parsed.target].join(' ').toLowerCase();
        const kwOk = !kw || source.includes(kw);
        const agentOk = !agentFilter || i.parsed.agentId === agentFilter;
        const kindOk = !kindFilter || i.parsed.kind === kindFilter;
        const modelOk = !modelFilter || i.model === modelFilter;
        return kwOk && agentOk && kindOk && modelOk;
      });

      document.getElementById('list').innerHTML = items.length ? items.map(i => `
        <div class="row">
          <div>
            <div class="title">${i.displayName || i.key}</div>
            <div class="meta">Agent：${i.parsed.agentId} · 类型：${i.parsed.kind} · 模型：${i.model || 'unknown'} · 最后活跃：${fmtTime(i.updatedAt)}</div>
            <div class="meta">渠道：${i.parsed.channel}${i.parsed.target ? ` · 目标：${i.parsed.target}` : ''}</div>
            <div class="meta">会话键：${i.key}</div>
          </div>
          <div style="text-align:right;min-width:240px">
            <div class="tokens">${fmtNum(i.totalTokens || 0)}</div>
            <div class="meta">总 Tokens</div>
            <div style="margin-top:8px">
              <span class="pill info">输入 ${fmtNum(i.inputTokens || 0)}</span>
              <span class="pill ok">输出 ${fmtNum(i.outputTokens || 0)}</span>
              <span class="pill warn">类型 ${i.parsed.kind}</span>
            </div>
            <div class="actions">
              <a class="btn" href="/session-detail.html?key=${encodeURIComponent(i.key)}">查看详情</a>
            </div>
          </div>
        </div>
      `).join('') : '<div class="empty">没有匹配的会话</div>';
    }

    async function load(){
      const raw = await fetch('/api/sessions-real').then(r => r.json());
      all = enrich(raw);
      renderStats(all);
      fillFilters(all);
      render();
    }

    ['keyword','agentFilter','kindFilter','modelFilter'].forEach(id => {
      document.getElementById(id).addEventListener(id === 'keyword' ? 'input' : 'change', render);
    });

    document.getElementById('syncBtn').addEventListener('click', async () => {
      const btn = document.getElementById('syncBtn');
      btn.disabled = true;
      btn.textContent = '同步中...';
      await fetch('/api/sync-now', { method: 'POST' });
      await load();
      btn.disabled = false;
      btn.textContent = '立即同步';
    });

    load();
  </script>
</body>
</html>
