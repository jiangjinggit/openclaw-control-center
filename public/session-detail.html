<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会话详情 - OpenClaw 控制中心</title>
  <link rel="stylesheet" href="/theme-vars.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    .navbar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-title { font-size: 18px; font-weight: 700; }
    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border-primary);
      background: var(--bg-secondary);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--bg-hover); }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .panel-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }
    .info-item {
      padding: 16px;
      background: var(--bg-tertiary);
      border-radius: 10px;
    }
    .info-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }
    .info-value {
      font-weight: 600;
      font-size: 15px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
  <script src="/theme.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-content">
      <h1 class="page-title">会话详情</h1>
      <a href="/sessions.html" class="btn">返回列表</a>
    </div>
  </nav>
  <div class="container">
    <div class="panel">
      <h2 class="panel-title">基础信息</h2>
      <div class="info-grid" id="basicInfo">
        <div class="empty-state">
          <div class="empty-icon">💬</div>
          <div>加载中...</div>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2 class="panel-title">Token 统计</h2>
      <div class="info-grid" id="tokenInfo">加载中...</div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const key = params.get('key');
    
    async function load() {
      if (!key) {
        document.getElementById('basicInfo').innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div>缺少会话 key</div></div>';
        return;
      }
      
      try {
        const detail = await fetch(`/api/session-detail?key=${encodeURIComponent(key)}`).then(r => r.json());
        
        document.getElementById('basicInfo').innerHTML = `
          <div class="info-item">
            <div class="info-label">会话名称</div>
            <div class="info-value">${detail.displayName || detail.key}</div>
          </div>
          <div class="info-item">
            <div class="info-label">模型</div>
            <div class="info-value">${detail.model || 'unknown'}</div>
          </div>
          <div class="info-item">
            <div class="info-label">渠道</div>
            <div class="info-value">${detail.channel || 'unknown'}</div>
          </div>
          <div class="info-item">
            <div class="info-label">最后活跃</div>
            <div class="info-value">${detail.updatedAt ? new Date(detail.updatedAt).toLocaleString('zh-CN') : '未知'}</div>
          </div>
        `;
        
        document.getElementById('tokenInfo').innerHTML = `
          <div class="info-item">
            <div class="info-label">总 Tokens</div>
            <div class="info-value">${(detail.totalTokens || 0).toLocaleString('zh-CN')}</div>
          </div>
          <div class="info-item">
            <div class="info-label">输入 Tokens</div>
            <div class="info-value">${(detail.inputTokens || 0).toLocaleString('zh-CN')}</div>
          </div>
          <div class="info-item">
            <div class="info-label">输出 Tokens</div>
            <div class="info-value">${(detail.outputTokens || 0).toLocaleString('zh-CN')}</div>
          </div>
        `;
      } catch (err) {
        console.error('加载失败', err);
        document.getElementById('basicInfo').innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div>加载失败</div></div>';
      }
    }
    
    load();
  </script>
</body>
</html>
