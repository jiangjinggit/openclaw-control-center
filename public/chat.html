<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对话 - OpenClaw 控制中心</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;margin:0;color:#111827;height:100vh;overflow:hidden}
    .container{display:flex;height:100vh}
    .sidebar{width:280px;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column}
    .sidebar-header{padding:16px;border-bottom:1px solid #e5e7eb}
    .sidebar-title{font-size:18px;font-weight:700;margin-bottom:8px}
    .new-chat-btn{width:100%;padding:10px;background:#111827;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600}
    .new-chat-btn:hover{background:#374151}
    .agent-list{flex:1;overflow-y:auto;padding:8px}
    .agent-item{padding:12px;border-radius:10px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
    .agent-item:hover{background:#f8fafc;border-color:#e2e8f0}
    .agent-item.active{background:#eff6ff;border-color:#3b82f6}
    .agent-name{font-weight:600;font-size:14px}
    .agent-meta{font-size:12px;color:#64748b;margin-top:4px}
    .main{flex:1;display:flex;flex-direction:column;background:#fff}
    .chat-header{padding:16px 24px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
    .chat-title{font-size:18px;font-weight:700}
    .back-btn{padding:8px 14px;border:1px solid #dbe1ea;background:#fff;border-radius:10px;text-decoration:none;color:#334155;cursor:pointer}
    .messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
    .message{display:flex;gap:12px;max-width:80%}
    .message.user{align-self:flex-end;flex-direction:row-reverse}
    .message.assistant{align-self:flex-start}
    .message-avatar{width:36px;height:36px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
    .message.user .message-avatar{background:#3b82f6;color:#fff}
    .message-content{padding:12px 16px;border-radius:14px;line-height:1.6;word-break:break-word}
    .message.user .message-content{background:#3b82f6;color:#fff}
    .message.assistant .message-content{background:#f1f5f9;color:#111827}
    .message-time{font-size:11px;color:#94a3b8;margin-top:4px}
    .input-area{padding:16px 24px;border-top:1px solid #e5e7eb}
    .input-wrapper{display:flex;gap:12px;align-items:flex-end}
    .input-box{flex:1;min-height:44px;max-height:120px;padding:12px;border:1px solid #dbe1ea;border-radius:12px;resize:none;font-family:inherit;font-size:14px}
    .send-btn{padding:12px 24px;background:#3b82f6;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600}
    .send-btn:hover{background:#2563eb}
    .send-btn:disabled{background:#94a3b8;cursor:not-allowed}
    .empty{color:#94a3b8;text-align:center;padding:40px 20px}
    .loading{display:flex;gap:4px;padding:12px}
    .loading-dot{width:8px;height:8px;border-radius:50%;background:#94a3b8;animation:bounce 1.4s infinite ease-in-out both}
    .loading-dot:nth-child(1){animation-delay:-0.32s}
    .loading-dot:nth-child(2){animation-delay:-0.16s}
    @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">对话</div>
        <button class="new-chat-btn" id="newChatBtn">+ 新对话</button>
      </div>
      <div class="agent-list" id="agentList">加载中...</div>
    </div>
    <div class="main">
      <div class="chat-header">
        <div class="chat-title" id="chatTitle">选择一个 Agent 开始对话</div>
        <a class="back-btn" href="/">返回首页</a>
      </div>
      <div class="messages" id="messages">
        <div class="empty">选择左侧 Agent 开始对话</div>
      </div>
      <div class="input-area">
        <div class="input-wrapper">
          <textarea class="input-box" id="inputBox" placeholder="输入消息..." rows="1"></textarea>
          <button class="send-btn" id="sendBtn" disabled>发送</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let agents = [];
    let currentAgent = null;
    let messages = [];
    let isLoading = false;

    function fmtTime(t) {
      return new Date(t).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    async function loadAgents() {
      try {
        agents = await fetch('/api/agents-summary').then(r => r.json());
        renderAgentList();
      } catch (err) {
        console.error('加载 Agent 失败', err);
        document.getElementById('agentList').innerHTML = '<div class="empty">加载失败</div>';
      }
    }

    function renderAgentList() {
      document.getElementById('agentList').innerHTML = agents.length ? agents.map(a => `
        <div class="agent-item ${currentAgent?.id === a.id ? 'active' : ''}" data-agent-id="${a.id}">
          <div class="agent-name">${a.name}</div>
          <div class="agent-meta">${a.model}${a.isDefault ? ' · 默认' : ''}</div>
        </div>
      `).join('') : '<div class="empty">未配置 Agent</div>';

      document.querySelectorAll('.agent-item').forEach(el => {
        el.onclick = () => selectAgent(el.dataset.agentId);
      });
    }

    function selectAgent(agentId) {
      currentAgent = agents.find(a => a.id === agentId);
      if (!currentAgent) return;

      messages = [];
      renderMessages();
      renderAgentList();
      document.getElementById('chatTitle').textContent = `与 ${currentAgent.name} 对话`;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('inputBox').disabled = false;
      document.getElementById('inputBox').focus();
    }

    function renderMessages() {
      const container = document.getElementById('messages');
      if (messages.length === 0) {
        container.innerHTML = '<div class="empty">开始与 Agent 对话</div>';
        return;
      }

      container.innerHTML = messages.map(m => `
        <div class="message ${m.role}">
          <div class="message-avatar">${m.role === 'user' ? 'U' : 'A'}</div>
          <div>
            <div class="message-content">${m.content}</div>
            <div class="message-time">${fmtTime(m.timestamp)}</div>
          </div>
        </div>
      `).join('');

      if (isLoading) {
        container.innerHTML += `
          <div class="message assistant">
            <div class="message-avatar">A</div>
            <div class="loading">
              <div class="loading-dot"></div>
              <div class="loading-dot"></div>
              <div class="loading-dot"></div>
            </div>
          </div>
        `;
      }

      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('inputBox');
      const content = input.value.trim();
      if (!content || !currentAgent || isLoading) return;

      const userMessage = {
        role: 'user',
        content,
        timestamp: Date.now()
      };

      messages.push(userMessage);
      input.value = '';
      isLoading = true;
      renderMessages();

      try {
        // 这里应该调用实际的 OpenClaw API
        // 目前先模拟一个简单的响应
        await new Promise(resolve => setTimeout(resolve, 1000));

        const assistantMessage = {
          role: 'assistant',
          content: `这是一个模拟响应。实际使用时，这里会调用 OpenClaw sessions_send API 向 ${currentAgent.name} 发送消息并获取回复。`,
          timestamp: Date.now()
        };

        messages.push(assistantMessage);
      } catch (err) {
        console.error('发送消息失败', err);
        messages.push({
          role: 'assistant',
          content: '抱歉，发送消息失败。请检查 Agent 状态。',
          timestamp: Date.now()
        });
      } finally {
        isLoading = false;
        renderMessages();
      }
    }

    document.getElementById('sendBtn').onclick = sendMessage;
    document.getElementById('inputBox').onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    };

    document.getElementById('newChatBtn').onclick = () => {
      if (currentAgent) {
        messages = [];
        renderMessages();
      }
    };

    // 自动调整输入框高度
    document.getElementById('inputBox').oninput = function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    };

    loadAgents();
  </script>
</body>
</html>
