<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统诊断 - OpenClaw 控制中心</title>
  <link rel="stylesheet" href="/theme-vars.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    
    .navbar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-title {
      font-size: 18px;
      font-weight: 700;
    }
    .page-subtitle {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }
    .nav-actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border-primary);
      background: var(--bg-secondary);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--bg-hover);
    }
    .btn-primary {
      background: var(--accent-primary);
      color: white;
      border-color: var(--accent-primary);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    
    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .panel-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    
    .check-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .check-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--bg-tertiary);
      border-radius: 10px;
    }
    .check-name {
      font-weight: 600;
      font-size: 14px;
    }
    .check-status {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .check-status.pass {
      background: var(--success-bg);
      color: var(--success);
    }
    .check-status.fail {
      background: var(--error-bg);
      color: var(--error);
    }
    .check-status.warn {
      background: var(--warning-bg);
      color: var(--warning);
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
  <script src="/theme.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-content">
      <div>
        <h1 class="page-title">系统诊断</h1>
        <p class="page-subtitle">运行 OpenClaw Doctor 检查系统健康状态</p>
      </div>
      <div class="nav-actions">
        <button class="btn btn-primary" id="runBtn">运行诊断</button>
        <a href="/" class="btn">返回首页</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="panel">
      <h2 class="panel-title">诊断结果</h2>
      <div class="check-list" id="results">
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <div>点击"运行诊断"开始检查</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function runDoctor() {
      const btn = document.getElementById('runBtn');
      const container = document.getElementById('results');
      
      btn.disabled = true;
      btn.textContent = '诊断中...';
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><div>正在运行诊断...</div></div>';

      try {
        const result = await fetch('/api/doctor', { method: 'POST' }).then(r => r.json());
        
        if (result.checks && result.checks.length > 0) {
          container.innerHTML = result.checks.map(check => `
            <div class="check-item">
              <div class="check-name">${check.name}</div>
              <span class="check-status ${check.status}">${check.status === 'pass' ? '✅ 通过' : check.status === 'fail' ? '❌ 失败' : '⚠️ 警告'}</span>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<div class="empty-state"><div class="empty-icon">✅</div><div>所有检查通过</div></div>';
        }
      } catch (err) {
        console.error('诊断失败', err);
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div>诊断失败</div></div>';
      } finally {
        btn.disabled = false;
        btn.textContent = '运行诊断';
      }
    }

    document.getElementById('runBtn').onclick = runDoctor;
  </script>
</body>
</html>
