<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成本分析 - OpenClaw 控制中心</title>
  <link rel="stylesheet" href="/theme-vars.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    
    /* 导航栏 */
    .navbar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-title {
      font-size: 18px;
      font-weight: 700;
    }
    .page-subtitle {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }
    .nav-actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border-primary);
      background: var(--bg-secondary);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--bg-hover);
    }
    .btn-primary {
      background: var(--accent-primary);
      color: white;
      border-color: var(--accent-primary);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    
    /* 主容器 */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    
    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      padding: 24px;
    }
    .stat-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .stat-value {
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      color: #dc2626;
      margin-bottom: 8px;
    }
    .stat-hint {
      font-size: 12px;
      color: var(--text-muted);
    }
    
    /* 面板 */
    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .panel-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    
    /* 成本列表 */
    .cost-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .cost-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--bg-tertiary);
      border-radius: 10px;
      transition: all 0.2s;
    }
    .cost-item:hover {
      background: var(--bg-hover);
    }
    .cost-name {
      font-weight: 600;
      font-size: 14px;
    }
    .cost-value {
      font-weight: 700;
      font-size: 18px;
      color: #dc2626;
    }
    
    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    /* 警告提示 */
    .alert {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .alert-icon {
      font-size: 20px;
      flex-shrink: 0;
    }
    .alert-content {
      flex: 1;
    }
    .alert-title {
      font-weight: 600;
      color: var(--warning);
      margin-bottom: 4px;
    }
    .alert-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    
    /* 响应式 */
    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="/theme.js"></script>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-content">
      <div>
        <h1 class="page-title">成本分析</h1>
        <p class="page-subtitle">基于 Token 使用量的成本估算</p>
      </div>
      <div class="nav-actions">
        <button class="btn btn-primary" id="syncBtn">立即同步</button>
        <a href="/" class="btn">返回首页</a>
      </div>
    </div>
  </nav>

  <!-- 主容器 -->
  <div class="container">
    <!-- 警告提示 -->
    <div class="alert">
      <div class="alert-icon">⚠️</div>
      <div class="alert-content">
        <div class="alert-title">成本估算说明</div>
        <div class="alert-text">
          以下成本数据基于 Token 使用量估算，并非实际账单金额。实际费用请以各 AI 服务商的账单为准。
        </div>
      </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-label">今日成本（估算）</div>
        <div class="stat-value" id="dailyCost">-</div>
        <div class="stat-hint">基于 Token 使用量</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">本周成本（估算）</div>
        <div class="stat-value" id="weeklyCost">-</div>
        <div class="stat-hint">最近 7 天累计</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">本月成本（估算）</div>
        <div class="stat-value" id="monthlyCost">-</div>
        <div class="stat-hint">当月累计</div>
      </div>
    </div>

    <!-- 按 Agent 分解 -->
    <div class="panel">
      <h2 class="panel-title">按 Agent 分解</h2>
      <div class="cost-list" id="byAgent">
        <div class="empty-state">
          <div class="empty-icon">💰</div>
          <div>加载中...</div>
        </div>
      </div>
    </div>

    <!-- 按定时任务分解 -->
    <div class="panel">
      <h2 class="panel-title">按定时任务分解</h2>
      <div class="cost-list" id="byCron">
        <div class="empty-state">
          <div class="empty-icon">⏰</div>
          <div>加载中...</div>
        </div>
      </div>
    </div>

    <!-- 按会话分解 (Top 10) -->
    <div class="panel">
      <h2 class="panel-title">按会话分解（Top 10）</h2>
      <div class="cost-list" id="bySession">
        <div class="empty-state">
          <div class="empty-icon">💬</div>
          <div>加载中...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function fmt(n) {
      return Number(n || 0).toFixed(2);
    }

    function renderCostList(container, data) {
      const entries = Object.entries(data || {}).sort((a, b) => b[1] - a[1]);
      
      if (entries.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><div>暂无数据</div></div>';
        return;
      }

      container.innerHTML = entries.map(([name, value]) => `
        <div class="cost-item">
          <div class="cost-name">${name}</div>
          <div class="cost-value">¥${fmt(value)}</div>
        </div>
      `).join('');
    }

    async function loadCost() {
      try {
        const cost = await fetch('/api/cost-breakdown').then(r => r.json());

        // 更新统计卡片
        document.getElementById('dailyCost').textContent = `¥${fmt(cost.daily?.total || 0)}`;
        document.getElementById('weeklyCost').textContent = `¥${fmt(cost.weekly?.total || 0)}`;
        document.getElementById('monthlyCost').textContent = `¥${fmt(cost.monthly?.total || 0)}`;

        // 更新分解列表
        renderCostList(document.getElementById('byAgent'), cost.daily?.byAgent);
        renderCostList(document.getElementById('byCron'), cost.daily?.byCron);
        
        // 按会话分解 (Top 10)
        const bySession = cost.daily?.bySession || {};
        const topSessions = Object.entries(bySession)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 10)
          .reduce((obj, [k, v]) => ({ ...obj, [k]: v }), {});
        renderCostList(document.getElementById('bySession'), topSessions);

      } catch (err) {
        console.error('加载失败', err);
      }
    }

    document.getElementById('syncBtn').onclick = async () => {
      const btn = document.getElementById('syncBtn');
      btn.disabled = true;
      btn.textContent = '同步中...';
      await fetch('/api/sync-now', { method: 'POST' });
      await loadCost();
      btn.disabled = false;
      btn.textContent = '立即同步';
    };

    loadCost();
  </script>
</body>
</html>
