<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成本分析 - OpenClaw 控制中心</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;margin:0;color:#111827}
    .wrap{max-width:1200px;margin:0 auto;padding:24px}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
    .btn{border:1px solid #dbe1ea;background:#fff;border-radius:10px;padding:9px 14px;text-decoration:none;color:#334155;cursor:pointer}
    .panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin-bottom:16px}
    .section-title{font-size:18px;font-weight:700;margin-bottom:16px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
    .stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:14px}
    .label{font-size:12px;color:#64748b;display:block;margin-bottom:8px}
    .value{font-size:28px;font-weight:700;color:#111827}
    .value.cost{color:#dc2626}
    .hint{font-size:11px;color:#94a3b8;margin-top:4px}
    .breakdown{display:flex;flex-direction:column;gap:12px}
    .breakdown-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #e2e8f0;border-radius:10px;background:#fff}
    .breakdown-name{font-weight:600;font-size:14px}
    .breakdown-value{font-weight:700;font-size:16px;color:#dc2626}
    .breakdown-meta{font-size:12px;color:#64748b;margin-top:4px}
    .empty{color:#94a3b8;padding:20px 0;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>成本分析</h1>
        <div class="label">基于 Token 使用量的成本估算（非实际账单）</div>
      </div>
      <div>
        <button class="btn" id="syncBtn">立即同步</button>
        <a class="btn" href="/">返回首页</a>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="panel">
      <div class="section-title">按 Agent 分解</div>
      <div class="breakdown" id="byAgent">加载中...</div>
    </div>

    <div class="panel">
      <div class="section-title">按定时任务分解</div>
      <div class="breakdown" id="byCron">加载中...</div>
    </div>

    <div class="panel">
      <div class="section-title">按会话分解（Top 10）</div>
      <div class="breakdown" id="bySession">加载中...</div>
    </div>
  </div>

  <script>
    function fmt(n) {
      return Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtTokens(n) {
      return Number(n || 0).toLocaleString('zh-CN');
    }

    async function load() {
      try {
        const cost = await fetch('/api/cost-breakdown').then(r => r.json());

        // 统计卡
        document.getElementById('stats').innerHTML = [
          ['今日成本（估算）', `¥${fmt(cost.daily?.total || 0)}`],
          ['本周成本（估算）', `¥${fmt(cost.weekly?.total || 0)}`],
          ['本月成本（估算）', `¥${fmt(cost.monthly?.total || 0)}`]
        ].map(([l, v]) => `<div class="stat"><span class="label">${l}</span><div class="value cost">${v}</div><div class="hint">基于 Token 使用量估算</div></div>`).join('');

        // 按 Agent 分解
        const byAgent = Object.entries(cost.daily?.byAgent || {}).sort((a, b) => b[1] - a[1]);
        document.getElementById('byAgent').innerHTML = byAgent.length ? byAgent.map(([agent, value]) => `
          <div class="breakdown-item">
            <div>
              <div class="breakdown-name">${agent}</div>
            </div>
            <div class="breakdown-value">¥${fmt(value)}</div>
          </div>
        `).join('') : '<div class="empty">暂无数据</div>';

        // 按定时任务分解
        const byCron = Object.entries(cost.daily?.byCron || {}).sort((a, b) => b[1] - a[1]);
        document.getElementById('byCron').innerHTML = byCron.length ? byCron.map(([cron, value]) => `
          <div class="breakdown-item">
            <div>
              <div class="breakdown-name">${cron}</div>
            </div>
            <div class="breakdown-value">¥${fmt(value)}</div>
          </div>
        `).join('') : '<div class="empty">暂无数据</div>';

        // 按会话分解（Top 10）
        const bySession = Object.entries(cost.daily?.bySession || {})
          .sort((a, b) => b[1] - a[1])
          .slice(0, 10);
        document.getElementById('bySession').innerHTML = bySession.length ? bySession.map(([session, value]) => `
          <div class="breakdown-item">
            <div>
              <div class="breakdown-name">${session}</div>
            </div>
            <div class="breakdown-value">¥${fmt(value)}</div>
          </div>
        `).join('') : '<div class="empty">暂无数据</div>';

      } catch (err) {
        console.error('加载失败', err);
        document.body.innerHTML = '<div class="wrap"><div class="empty">加载失败，请检查服务状态</div></div>';
      }
    }

    document.getElementById('syncBtn').addEventListener('click', async () => {
      const btn = document.getElementById('syncBtn');
      btn.disabled = true;
      btn.textContent = '同步中...';
      await fetch('/api/sync-now', { method: 'POST' });
      await load();
      btn.disabled = false;
      btn.textContent = '立即同步';
    });

    load();
  </script>
</body>
</html>
