<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对话 - OpenClaw 控制中心</title>
  <link rel="stylesheet" href="/theme-vars.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }
    
    .container { display: flex; height: 100vh; }
    
    /* 侧边栏 */
    .sidebar {
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-primary);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-primary);
    }
    .sidebar-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .new-chat-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }
    .new-chat-btn:hover {
      background: var(--accent-hover);
    }
    .agent-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .agent-item {
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 6px;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .agent-item:hover {
      background: var(--bg-hover);
      border-color: var(--border-secondary);
    }
    .agent-item.active {
      background: var(--accent-light);
      border-color: var(--accent-primary);
    }
    .agent-name {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .agent-meta {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    
    /* 主聊天区 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
    }
    .chat-header {
      padding: 20px 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-title {
      font-size: 18px;
      font-weight: 700;
    }
    .back-btn {
      padding: 8px 16px;
      border: 1px solid var(--border-primary);
      background: var(--bg-secondary);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: var(--bg-hover);
    }
    
    /* 消息区 */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .message {
      display: flex;
      gap: 12px;
      max-width: 70%;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message.assistant {
      align-self: flex-start;
    }
    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      flex-shrink: 0;
      font-size: 16px;
    }
    .message.user .message-avatar {
      background: var(--accent-primary);
      color: white;
    }
    .message-content {
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.6;
      word-break: break-word;
    }
    .message.user .message-content {
      background: var(--accent-primary);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.assistant .message-content {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-primary);
      border-bottom-left-radius: 4px;
    }
    .message-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      padding: 0 4px;
    }
    
    /* 输入区 */
    .input-area {
      padding: 20px 24px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-primary);
    }
    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      max-width: 1000px;
      margin: 0 auto;
    }
    .input-box {
      flex: 1;
      min-height: 48px;
      max-height: 120px;
      padding: 14px 16px;
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      resize: none;
      font-family: inherit;
      font-size: 14px;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: all 0.2s;
    }
    .input-box:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-light);
    }
    .send-btn {
      padding: 14px 24px;
      background: var(--accent-primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }
    .send-btn:hover {
      background: var(--accent-hover);
    }
    .send-btn:disabled {
      background: var(--bg-tertiary);
      color: var(--text-muted);
      cursor: not-allowed;
    }
    
    /* 加载动画 */
    .loading {
      display: flex;
      gap: 6px;
      padding: 14px 18px;
    }
    .loading-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .loading-dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    
    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    /* 响应式 */
    @media (max-width: 768px) {
      .sidebar {
        width: 240px;
      }
      .message {
        max-width: 85%;
      }
    }
  </style>
  <script src="/theme.js"></script>
</head>
<body>
  <div class="container">
    <!-- 侧边栏 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">对话</div>
        <button class="new-chat-btn" id="newChatBtn">+ 新对话</button>
      </div>
      <div class="agent-list" id="agentList">加载中...</div>
    </div>

    <!-- 主聊天区 -->
    <div class="main">
      <div class="chat-header">
        <div class="chat-title" id="chatTitle">选择一个 Agent 开始对话</div>
        <a class="back-btn" href="/">返回首页</a>
      </div>
      <div class="messages" id="messages">
        <div class="empty-state">
          <div class="empty-icon">💬</div>
          <div>选择左侧 Agent 开始对话</div>
        </div>
      </div>
      <div class="input-area">
        <div class="input-wrapper">
          <textarea class="input-box" id="inputBox" placeholder="输入消息..." rows="1" disabled></textarea>
          <button class="send-btn" id="sendBtn" disabled>发送</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let agents = [];
    let currentAgent = null;
    let messages = [];
    let isLoading = false;

    function fmtTime(t) {
      return new Date(t).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    async function loadAgents() {
      try {
        agents = await fetch('/api/agents-summary').then(r => r.json());
        renderAgentList();
      } catch (err) {
        console.error('加载 Agent 失败', err);
        document.getElementById('agentList').innerHTML = '<div class="empty-state">加载失败</div>';
      }
    }

    function renderAgentList() {
      document.getElementById('agentList').innerHTML = agents.length ? agents.map(a => `
        <div class="agent-item ${currentAgent?.id === a.id ? 'active' : ''}" data-agent-id="${a.id}">
          <div class="agent-name">${a.name}</div>
          <div class="agent-meta">${a.model}${a.isDefault ? ' · 默认' : ''}</div>
        </div>
      `).join('') : '<div class="empty-state">未配置 Agent</div>';

      document.querySelectorAll('.agent-item').forEach(el => {
        el.onclick = () => selectAgent(el.dataset.agentId);
      });
    }

    function selectAgent(agentId) {
      currentAgent = agents.find(a => a.id === agentId);
      if (!currentAgent) return;

      messages = [];
      renderMessages();
      renderAgentList();
      document.getElementById('chatTitle').textContent = `与 ${currentAgent.name} 对话`;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('inputBox').disabled = false;
      document.getElementById('inputBox').focus();
    }

    function renderMessages() {
      const container = document.getElementById('messages');
      if (messages.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><div>开始与 Agent 对话</div></div>';
        return;
      }

      container.innerHTML = messages.map(m => `
        <div class="message ${m.role}">
          <div class="message-avatar">${m.role === 'user' ? '👤' : '🤖'}</div>
          <div>
            <div class="message-content">${m.content}</div>
            <div class="message-time">${fmtTime(m.timestamp)}</div>
          </div>
        </div>
      `).join('');

      if (isLoading) {
        container.innerHTML += `
          <div class="message assistant">
            <div class="message-avatar">🤖</div>
            <div class="loading">
              <div class="loading-dot"></div>
              <div class="loading-dot"></div>
              <div class="loading-dot"></div>
            </div>
          </div>
        `;
      }

      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('inputBox');
      const content = input.value.trim();
      if (!content || !currentAgent || isLoading) return;

      const userMessage = {
        role: 'user',
        content,
        timestamp: Date.now()
      };

      messages.push(userMessage);
      input.value = '';
      input.style.height = 'auto';
      isLoading = true;
      renderMessages();

      try {
        // 调用真实的消息发送 API
        const res = await fetch('/api/chat/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            agentId: currentAgent.id, 
            message: content 
          })
        });

        const data = await res.json();
        
        if (data.ok) {
          const assistantMessage = {
            role: 'assistant',
            content: data.response || '(无响应)',
            timestamp: Date.now()
          };
          messages.push(assistantMessage);
        } else {
          throw new Error(data.error || '发送失败');
        }
      } catch (err) {
        console.error('发送消息失败', err);
        messages.push({
          role: 'assistant',
          content: '抱歉，发送消息失败。请检查 Agent 状态。',
          timestamp: Date.now()
        });
      } finally {
        isLoading = false;
        renderMessages();
      }
    }

    document.getElementById('sendBtn').onclick = sendMessage;
    document.getElementById('inputBox').onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    };

    document.getElementById('newChatBtn').onclick = () => {
      if (currentAgent) {
        messages = [];
        renderMessages();
      }
    };

    // 自动调整输入框高度
    document.getElementById('inputBox').oninput = function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    };

    loadAgents();
  </script>
</body>
</html>
