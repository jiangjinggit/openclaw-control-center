<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代理设置 - OpenClaw 控制中心</title>
  <link rel="stylesheet" href="/theme-vars.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    
    .navbar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-title {
      font-size: 18px;
      font-weight: 700;
    }
    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border-primary);
      background: var(--bg-secondary);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--bg-hover);
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    
    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .panel-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      font-size: 14px;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent-primary);
    }
    .form-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    
    .btn-primary {
      background: var(--accent-primary);
      color: white;
      border-color: var(--accent-primary);
      cursor: pointer;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-secondary {
      cursor: pointer;
    }
  </style>
  <script src="/theme.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-content">
      <h1 class="page-title">代理设置</h1>
      <a href="/" class="btn">返回首页</a>
    </div>
  </nav>

  <div class="container">
    <div class="panel">
      <h2 class="panel-title">HTTP 代理配置</h2>
      <form id="proxyForm">
        <div class="form-group">
          <label class="form-label">代理地址</label>
          <input type="text" class="form-input" id="proxyUrl" placeholder="http://127.0.0.1:7890">
          <div class="form-hint">留空表示不使用代理</div>
        </div>
        
        <div class="form-group">
          <label class="form-label">同步到 Telegram</label>
          <input type="checkbox" id="syncTelegram">
          <span style="margin-left: 8px; font-size: 14px;">同步代理设置到 Telegram 配置</span>
        </div>
        
        <div style="display: flex; gap: 12px;">
          <button type="submit" class="btn btn-primary">保存设置</button>
          <button type="button" class="btn btn-secondary" id="testBtn">测试连接</button>
        </div>
      </form>
    </div>
    
    <div class="panel" id="testResult" style="display: none;">
      <h2 class="panel-title">测试结果</h2>
      <div id="testOutput"></div>
    </div>
  </div>

  <script>
    async function loadConfig() {
      try {
        const config = await fetch('/api/proxy-config').then(r => r.json());
        document.getElementById('proxyUrl').value = config.proxyUrl || '';
        document.getElementById('syncTelegram').checked = config.syncTelegram || false;
      } catch (err) {
        console.error('加载配置失败', err);
      }
    }

    document.getElementById('proxyForm').onsubmit = async (e) => {
      e.preventDefault();
      const proxyUrl = document.getElementById('proxyUrl').value;
      const syncTelegram = document.getElementById('syncTelegram').checked;
      
      try {
        await fetch('/api/proxy-config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ proxyUrl, syncTelegram })
        });
        alert('保存成功');
      } catch (err) {
        alert('保存失败');
      }
    };

    document.getElementById('testBtn').onclick = async () => {
      const proxyUrl = document.getElementById('proxyUrl').value;
      const resultPanel = document.getElementById('testResult');
      const output = document.getElementById('testOutput');
      
      resultPanel.style.display = 'block';
      output.textContent = '测试中...';
      
      try {
        const result = await fetch('/api/proxy-test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ proxyUrl })
        }).then(r => r.json());
        
        output.textContent = result.success ? '✅ 连接成功' : '❌ 连接失败';
      } catch (err) {
        output.textContent = '❌ 测试失败';
      }
    };

    loadConfig();
  </script>
</body>
</html>
