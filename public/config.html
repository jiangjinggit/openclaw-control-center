<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配置概览 - OpenClaw 控制中心</title>
  <link rel="stylesheet" href="/theme-vars.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    
    /* 导航栏 */
    .navbar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-title {
      font-size: 18px;
      font-weight: 700;
    }
    .page-subtitle {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }
    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border-primary);
      background: var(--bg-secondary);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--bg-hover);
    }
    
    /* 主容器 */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    
    /* 面板 */
    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .panel-title {
      font-size: 18px;
      font-weight: 700;
    }
    
    /* 配置网格 */
    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }
    .config-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-primary);
      border-radius: 10px;
      padding: 20px;
    }
    .config-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }
    .config-value {
      font-weight: 600;
      font-size: 15px;
      word-break: break-all;
      margin-bottom: 8px;
    }
    .config-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }
    
    /* 徽章 */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-success {
      background: var(--success-bg);
      color: var(--success);
    }
    .badge-warning {
      background: var(--warning-bg);
      color: var(--warning);
    }
    .badge-error {
      background: var(--error-bg);
      color: var(--error);
    }
    
    /* 风险列表 */
    .risk-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .risk-item {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 10px;
      padding: 16px;
    }
    .risk-type {
      font-weight: 600;
      color: var(--warning);
      margin-bottom: 4px;
    }
    .risk-text {
      font-size: 14px;
      color: var(--text-secondary);
    }
    
    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    
    /* 响应式 */
    @media (max-width: 768px) {
      .config-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="/theme.js"></script>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-content">
      <div>
        <h1 class="page-title">配置概览</h1>
        <p class="page-subtitle">查看关键配置与风险项</p>
      </div>
      <a href="/" class="btn">返回首页</a>
    </div>
  </nav>

  <!-- 主容器 -->
  <div class="container">
    <!-- 基础配置 -->
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">基础配置</h2>
        <span class="badge" id="basicStatus">加载中...</span>
      </div>
      <div class="config-grid" id="basicConfig">加载中...</div>
    </div>

    <!-- Agent 配置 -->
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Agent 配置</h2>
        <span class="badge" id="agentStatus">加载中...</span>
      </div>
      <div class="config-grid" id="agentConfig">加载中...</div>
    </div>

    <!-- 渠道配置 -->
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">渠道配置</h2>
        <span class="badge" id="channelStatus">加载中...</span>
      </div>
      <div class="config-grid" id="channelConfig">加载中...</div>
    </div>

    <!-- 模型配置 -->
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">模型配置</h2>
        <span class="badge" id="modelStatus">加载中...</span>
      </div>
      <div class="config-grid" id="modelConfig">加载中...</div>
    </div>

    <!-- 风险提示 -->
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">风险提示</h2>
        <span class="badge badge-warning" id="riskCount">0</span>
      </div>
      <div class="risk-list" id="riskList">加载中...</div>
    </div>
  </div>

  <script>
    async function load() {
      try {
        const [agents, channels, models, summary] = await Promise.all([
          fetch('/api/agents-summary').then(r => r.json()),
          fetch('/api/channels-summary').then(r => r.json()),
          fetch('/api/models-summary').then(r => r.json()),
          fetch('/api/control-center-summary').then(r => r.json())
        ]);

        // 基础配置
        const basicRisks = [];
        if (!summary.autoSyncEnabled) basicRisks.push('自动同步未启用');
        if (summary.errorCount > 0) basicRisks.push(`当前有 ${summary.errorCount} 个错误`);
        
        document.getElementById('basicStatus').textContent = basicRisks.length ? '待修复' : '正常';
        document.getElementById('basicStatus').className = `badge ${basicRisks.length ? 'badge-warning' : 'badge-success'}`;
        document.getElementById('basicConfig').innerHTML = `
          <div class="config-card">
            <div class="config-label">Gateway 状态</div>
            <div class="config-value">${summary.gateway === 'online' ? '✅ 在线' : '⚠️ 异常'}</div>
            <div class="config-meta">最后同步：${summary.lastSyncAt ? new Date(summary.lastSyncAt).toLocaleString('zh-CN') : '未知'}</div>
          </div>
          <div class="config-card">
            <div class="config-label">自动同步</div>
            <div class="config-value">${summary.autoSyncEnabled ? '✅ 已启用' : '❌ 未启用'}</div>
          </div>
          <div class="config-card">
            <div class="config-label">当前错误数</div>
            <div class="config-value">${summary.errorCount}</div>
          </div>
        `;

        // Agent 配置
        const agentRisks = [];
        if (agents.length === 0) agentRisks.push('未配置任何 Agent');
        const noModel = agents.filter(a => !a.model || a.model === 'unknown');
        if (noModel.length) agentRisks.push(`${noModel.length} 个 Agent 未配置模型`);

        document.getElementById('agentStatus').textContent = agentRisks.length ? '待修复' : '正常';
        document.getElementById('agentStatus').className = `badge ${agentRisks.length ? 'badge-warning' : 'badge-success'}`;
        document.getElementById('agentConfig').innerHTML = agents.length ? agents.map(a => `
          <div class="config-card">
            <div class="config-label">${a.name}${a.isDefault ? ' (默认)' : ''}</div>
            <div class="config-value">${a.id}</div>
            <div class="config-meta">模型：${a.model}</div>
            <div class="config-meta">工作区：${a.workspace || '未设置'}</div>
          </div>
        `).join('') : '<div class="empty-state">未配置 Agent</div>';

        // 渠道配置
        const channelRisks = channels.filter(c => c.issues && c.issues.length > 0);
        document.getElementById('channelStatus').textContent = channelRisks.length ? `${channelRisks.length} 个待修复` : '正常';
        document.getElementById('channelStatus').className = `badge ${channelRisks.length ? 'badge-warning' : 'badge-success'}`;
        document.getElementById('channelConfig').innerHTML = channels.length ? channels.map(c => `
          <div class="config-card">
            <div class="config-label">${c.channel}</div>
            <div class="config-value">${c.enabled ? '✅ 已启用' : '❌ 未启用'}</div>
            <div class="config-meta">账号：${c.enabledAccountCount}/${c.accountCount}</div>
            <div class="config-meta">凭据：${c.hasCredentials ? '已识别' : '未识别'}</div>
            ${c.issues && c.issues.length ? `<div class="config-meta" style="color:var(--warning)">⚠️ ${c.issues.join('；')}</div>` : ''}
          </div>
        `).join('') : '<div class="empty-state">未配置渠道</div>';

        // 模型配置
        const modelRisks = models.filter(m => m.issues && m.issues.length > 0);
        document.getElementById('modelStatus').textContent = modelRisks.length ? `${modelRisks.length} 个待修复` : '正常';
        document.getElementById('modelStatus').className = `badge ${modelRisks.length ? 'badge-warning' : 'badge-success'}`;
        document.getElementById('modelConfig').innerHTML = models.length ? models.map(m => `
          <div class="config-card">
            <div class="config-label">${m.provider}</div>
            <div class="config-value">${m.api}</div>
            <div class="config-meta">模型数：${m.modelCount} · Reasoning：${m.reasoningCount}</div>
            <div class="config-meta">Base URL：${m.baseUrl || '未设置'}</div>
            ${m.issues && m.issues.length ? `<div class="config-meta" style="color:var(--warning)">⚠️ ${m.issues.join('；')}</div>` : ''}
          </div>
        `).join('') : '<div class="empty-state">未配置 Provider</div>';

        // 汇总风险
        const allRisks = [
          ...basicRisks.map(r => ({ type: '基础配置', text: r })),
          ...agentRisks.map(r => ({ type: 'Agent', text: r })),
          ...channelRisks.flatMap(c => (c.issues || []).map(i => ({ type: `渠道 ${c.channel}`, text: i }))),
          ...modelRisks.flatMap(m => (m.issues || []).map(i => ({ type: `Provider ${m.provider}`, text: i })))
        ];

        document.getElementById('riskCount').textContent = allRisks.length;
        document.getElementById('riskList').innerHTML = allRisks.length ? allRisks.map(r => `
          <div class="risk-item">
            <div class="risk-type">${r.type}</div>
            <div class="risk-text">${r.text}</div>
          </div>
        `).join('') : '<div class="empty-state">✅ 暂无风险项</div>';

      } catch (err) {
        console.error('加载失败', err);
      }
    }

    load();
  </script>
</body>
</html>
