<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日志中心 - OpenClaw 控制中心</title>
  <link rel="stylesheet" href="/theme-vars.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Menlo", "Monaco", "Courier New", monospace;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    
    /* 导航栏 */
    .navbar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-title {
      font-size: 18px;
      font-weight: 700;
    }
    .page-subtitle {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }
    .nav-actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border-primary);
      background: var(--bg-secondary);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--bg-hover);
    }
    .btn-primary {
      background: var(--accent-primary);
      color: white;
      border-color: var(--accent-primary);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    
    /* 主容器 */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    
    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      padding: 20px;
    }
    .stat-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
    }
    
    /* 工具栏 */
    .toolbar {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-input {
      flex: 1;
      min-width: 240px;
      padding: 10px 16px;
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      font-size: 14px;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent-primary);
    }
    .select {
      padding: 10px 16px;
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      font-size: 14px;
      background: var(--bg-primary);
      color: var(--text-primary);
      cursor: pointer;
    }
    .filter-tabs {
      display: flex;
      gap: 8px;
    }
    .filter-tab {
      padding: 8px 16px;
      border: 1px solid var(--border-primary);
      background: var(--bg-secondary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.2s;
    }
    .filter-tab:hover {
      background: var(--bg-hover);
    }
    .filter-tab.active {
      background: var(--accent-primary);
      color: white;
      border-color: var(--accent-primary);
    }
    
    /* 日志列表 */
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .log-item {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 10px;
      padding: 16px;
      font-family: "Menlo", "Monaco", "Courier New", monospace;
      font-size: 13px;
      transition: all 0.2s;
    }
    .log-item:hover {
      border-color: var(--border-hover);
    }
    .log-item.error {
      border-left: 4px solid var(--error);
      background: var(--error-bg);
    }
    .log-item.warn {
      border-left: 4px solid var(--warning);
      background: var(--warning-bg);
    }
    .log-item.info {
      border-left: 4px solid var(--info);
    }
    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .log-level {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .log-level.error {
      background: var(--error);
      color: white;
    }
    .log-level.warn {
      background: var(--warning);
      color: white;
    }
    .log-level.info {
      background: var(--info);
      color: white;
    }
    .log-level.debug {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
    }
    .log-time {
      font-size: 12px;
      color: var(--text-muted);
    }
    .log-message {
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .log-meta {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-primary);
      font-size: 11px;
      color: var(--text-tertiary);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    
    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    /* 响应式 */
    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-input {
        width: 100%;
      }
    }
  </style>
  <script src="/theme.js"></script>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-content">
      <div>
        <h1 class="page-title">日志中心</h1>
        <p class="page-subtitle">查看系统日志和错误信息</p>
      </div>
      <div class="nav-actions">
        <button class="btn btn-primary" id="refreshBtn">刷新日志</button>
        <a href="/" class="btn">返回首页</a>
      </div>
    </div>
  </nav>

  <!-- 主容器 -->
  <div class="container">
    <!-- 统计卡片 -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-label">日志总数</div>
        <div class="stat-value" id="totalCount">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">错误数</div>
        <div class="stat-value" id="errorCount" style="color: var(--error)">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">警告数</div>
        <div class="stat-value" id="warnCount" style="color: var(--warning)">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">信息数</div>
        <div class="stat-value" id="infoCount" style="color: var(--info)">-</div>
      </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索日志内容...">
      <select class="select" id="sourceFilter">
        <option value="">全部来源</option>
      </select>
      <div class="filter-tabs">
        <button class="filter-tab active" data-level="">全部</button>
        <button class="filter-tab" data-level="error">错误</button>
        <button class="filter-tab" data-level="warn">警告</button>
        <button class="filter-tab" data-level="info">信息</button>
        <button class="filter-tab" data-level="debug">调试</button>
      </div>
    </div>

    <!-- 日志列表 -->
    <div class="log-list" id="logList">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <div>加载中...</div>
      </div>
    </div>
  </div>

  <script>
    let logs = [];
    let activeLevel = '';

    function fmt(n) {
      return Number(n || 0).toLocaleString('zh-CN');
    }

    function fmtTime(t) {
      if (!t) return '未知';
      return new Date(t).toLocaleString('zh-CN', { 
        month: 'short', 
        day: 'numeric', 
        hour: '2-digit', 
        minute: '2-digit',
        second: '2-digit'
      });
    }

    function renderStats() {
      const total = logs.length;
      const error = logs.filter(l => l.level === 'error').length;
      const warn = logs.filter(l => l.level === 'warn').length;
      const info = logs.filter(l => l.level === 'info').length;

      document.getElementById('totalCount').textContent = fmt(total);
      document.getElementById('errorCount').textContent = fmt(error);
      document.getElementById('warnCount').textContent = fmt(warn);
      document.getElementById('infoCount').textContent = fmt(info);
    }

    function getFilteredLogs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const source = document.getElementById('sourceFilter').value;

      return logs.filter(log => {
        const matchLevel = !activeLevel || log.level === activeLevel;
        const matchSource = !source || log.source === source;
        const matchSearch = !query || 
          (log.message || '').toLowerCase().includes(query) ||
          (log.source || '').toLowerCase().includes(query);
        
        return matchLevel && matchSource && matchSearch;
      });
    }

    function renderLogs() {
      const filtered = getFilteredLogs();
      const container = document.getElementById('logList');

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div>没有匹配的日志</div></div>';
        return;
      }

      container.innerHTML = filtered.map(log => `
        <div class="log-item ${log.level}">
          <div class="log-header">
            <span class="log-level ${log.level}">${log.level}</span>
            <span class="log-time">${fmtTime(log.timestamp)}</span>
          </div>
          <div class="log-message">${log.message || '(无消息)'}</div>
          ${log.source || log.context ? `
            <div class="log-meta">
              ${log.source ? `<span>📦 ${log.source}</span>` : ''}
              ${log.context ? `<span>🔍 ${log.context}</span>` : ''}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    async function loadLogs() {
      try {
        logs = await fetch('/api/logs?limit=200').then(r => r.json());
        
        // 更新来源过滤器
        const sources = [...new Set(logs.map(l => l.source).filter(Boolean))].sort();
        document.getElementById('sourceFilter').innerHTML = 
          '<option value="">全部来源</option>' + 
          sources.map(s => `<option value="${s}">${s}</option>`).join('');

        renderStats();
        renderLogs();
      } catch (err) {
        console.error('加载失败', err);
        document.getElementById('logList').innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div>加载失败</div></div>';
      }
    }

    // 事件监听
    document.getElementById('searchInput').oninput = renderLogs;
    document.getElementById('sourceFilter').onchange = renderLogs;

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeLevel = tab.dataset.level;
        renderLogs();
      };
    });

    document.getElementById('refreshBtn').onclick = async () => {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = '刷新中...';
      await loadLogs();
      btn.disabled = false;
      btn.textContent = '刷新日志';
    };

    loadLogs();
  </script>
</body>
</html>
